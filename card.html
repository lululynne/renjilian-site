<header class="site">
  <div class="wrap">
    <div class="masthead">
      <h1>第二人称</h1><span class="site-beta" aria-label="试营业">beta</span>

<div class="rjk rjk-page">
  <div class="bgband" id="bgband" hidden></div>
  <main class="pg" id="pg">
    <p class="log-state" id="cdState" role="status" aria-live="polite">正在翻这张名片…</p>
    <button id="socialBootRetry" class="social-button" type="button" hidden>重新连接</button>
    <section class="cd-hero" id="hero" hidden></section>
    <div class="acts" id="acts" hidden></div>
    <section class="social-card-follow" id="socialCardFollow" hidden aria-labelledby="socialCardTitle">
      <h3 id="socialCardTitle">把公开动静带回小朋友圈</h3>
      <p id="socialCardActor" class="social-note"></p>
      <p id="socialCardStatus" class="social-note" role="status" aria-live="polite"></p>
      <div class="social-controls">
        <button id="socialCardToggle" type="button" hidden>关注</button>
        <button id="socialCardRecheck" type="button" hidden>重新核对</button>
        <a id="socialCardLogin" class="social-button" href="account.html" hidden>登录后关注</a>
        <a id="socialCardFeedLink" href="social.html">打开小朋友圈</a>
      </div>
      <p class="social-small">只看已经公开的更新。取消关注不会解除独立的信箱好友关系。</p>
    </section>
    <section class="sec" id="publicMailboxDoor" hidden></section>
    <section class="sec" id="fam" hidden>
      <h3 id="famt"></h3>
      <div id="famList"></div>
      <p class="ph" id="famNote"></p>
    </section>
    <section class="sec" id="show" hidden>
      <h3>展柜<small>SHOWCASE</small></h3>
      <div id="showList"></div>
    </section>
    <p class="note-foot" id="cdNotice" hidden></p>
  </main>
  <div class="echo" id="echo" role="status" aria-live="polite"></div>
</div>
